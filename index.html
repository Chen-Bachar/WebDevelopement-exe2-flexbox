<!DOCTYPE html>
<html lang="he">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>
            Learning Flexbox
        </title>
        <link rel="stylesheet" href="styles.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> 
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>
    <body>  
        <div id="board">
            <h1>
                לוח המשחק
            </h1>
            
            <div id="level-navigation">
                <button class="level-arrow" id="right-arrow">
                    <
                </button>
                <span id="levels-text">
                    <span>שלב</span>
                    <span id="current-level">1</span>
                    <span>מתוך</span>
                    <span id="total-levels">7</span>
                </span>
                <button class="level-arrow" id="left-arrow">
                    >
                </button>
            </div>
            <div id="levels-bar"> 
                <button class="level-buttons" id="level1">1</button>
                <button class="level-buttons" id="level2">2</button>
                <button class="level-buttons" id="level3">3</button>
                <button class="level-buttons" id="level4">4</button>
                <button class="level-buttons" id="level5">5</button>
                <button class="level-buttons" id="level6">6</button>
                <button class="level-buttons" id="level7">7</button>
            </div>
            <div id="game-board"> 
            </div>
        </div>
        <div id="side-bar">
        <div id="instructions">
            <h1>
               הוראות
            </h1>
            <h5>
                יש להשתמש בפקודות הflexbox על מנת לעבור לשלב הבא
            </h5>
            <p id="level-instructions">
                סדרו את כל הפריטים בשורה, כך שיהיו ממורכזים במרכז הלוח.
            </p>
        </div>
        <div id="user-input">
            <h1>
              נסיונות
            </h1>
            <h5>
                <span>כמות נסיונות בשלב זה:</span>
                <span id="count-trials">0</span>
            </h5>
            <div id="editor">
        <div id="code-area">
            <div id="before-code">
                <p>
                    #game-board {
                </p>
                <p>
                    display: flex;
                </p>
            </div>
            <textarea id="user-code" ></textarea>
            <div id="after-code">}</div>
        </div>
        <button id="next" class="translate animated animation">הבא</button>
        <button id="reset" class="translate animated animation">איפוס</button>

        <h5 id="message"></h5>
    </div>
            
        </div>
        </div>
    <script src="game.js"></script>
    </body>
</html>
